services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    env_file:
      - .env
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Roda toda a suíte de testes sem precisar de Go instalado localmente:
  #   docker compose run --rm test
  # O teste de fechamento automático precisa de um MongoDB real (MONGODB_URL
  # do .env já aponta para o serviço "mongodb" acima).
  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    working_dir: /app
    command: go test ./... -v
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo-data:
    driver: local
